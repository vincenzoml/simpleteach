<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SimpleTeach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>" />
  <link rel="stylesheet" href="/src/shared/base.css" />
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); margin: 8px 0 0; }
    p.sub { color: var(--muted); font-size: 1.2rem; margin: 0 0 32px; }
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .app {
      display: block; text-decoration: none; color: var(--ink);
      background: var(--card); border-radius: 28px; padding: 24px 16px;
      box-shadow: var(--shadow); transition: transform .15s;
    }
    .app:hover { transform: translateY(-4px) rotate(-1deg); }
    .app svg { width: 110px; height: 110px; }
    .app h2 { margin: 8px 0 0; font-size: 1.6rem; }
    .app span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 120 120" width="110" height="110" aria-hidden="true">
      <circle cx="60" cy="64" r="44" fill="#9b6bff" />
      <circle cx="42" cy="56" r="16" fill="#fff" /><circle cx="78" cy="56" r="16" fill="#fff" />
      <circle cx="44" cy="58" r="7" fill="#3b2f5c" /><circle cx="76" cy="58" r="7" fill="#3b2f5c" />
      <path d="M54 72 L60 82 L66 72 Z" fill="#ffc93c" />
      <path d="M26 30 L40 44 L22 46 Z M94 30 L80 44 L98 46 Z" fill="#9b6bff" />
    </svg>
    <h1>SimpleTeach</h1>
    <p class="sub">Giochi per imparare, semplici e divertenti</p>
    <div class="apps">
      <a class="app" href="tabelline/">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="8" y="8" width="84" height="84" rx="22" fill="#ffc93c" />
          <text x="50" y="66" text-anchor="middle" font-size="44" font-weight="800" fill="#3b2f5c" font-family="Baloo 2, sans-serif">3×4</text>
        </svg>
        <h2>Tabelline</h2>
        <span>Terza elementare</span>
      </a>
    </div>
  </main>
</body>
</html>
