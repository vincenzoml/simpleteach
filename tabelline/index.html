<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Tabelline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>" />
  <link rel="stylesheet" href="/src/shared/base.css" />
  <link rel="stylesheet" href="/src/tabelline/style.css" />
</head>
<body>
  <svg class="bg-deco" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <circle cx="30" cy="80" r="40" fill="#ffc93c" opacity=".25" />
    <circle cx="380" cy="200" r="60" fill="#5fa8ff" opacity=".18" />
    <circle cx="60" cy="620" r="70" fill="#3ec5a3" opacity=".18" />
    <circle cx="360" cy="740" r="45" fill="#ff6f69" opacity=".2" />
    <path d="M330 60 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3z" fill="#ffc93c" opacity=".5" />
    <path d="M40 360 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z" fill="#9b6bff" opacity=".35" />
  </svg>

  <header class="topbar">
    <a class="icon-btn" href="../" aria-label="Torna ai giochi">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor" /></svg>
    </a>
    <div id="level" class="level" hidden>Livello <b>1</b></div>
    <div class="right">
    <button id="album-btn" class="icon-btn" aria-label="Collezione di sorprese">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="#9b6bff"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.1.6 3.1L12 14.5 9.2 16l.6-3.1-2.3-2.1 3.1-.4z" fill="#ffc93c"/></svg>
      <span id="album-new" class="dot" hidden></span>
    </button>
    <button id="mute" class="icon-btn" aria-label="Voce accesa/spenta">
      <svg viewBox="0 0 24 24">
        <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" />
        <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        <path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    </div>
  </header>

  <main>
    <div class="owl-wrap">
    <div id="bubble" class="bubble" hidden></div>
    <svg id="owl" class="owl" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M22 26 L38 42 L16 46 Z M98 26 L82 42 L104 46 Z" fill="#7d4fe0" />
      <ellipse cx="60" cy="62" rx="44" ry="42" fill="#9b6bff" />
      <ellipse cx="60" cy="78" rx="26" ry="22" fill="#c9b2ff" />
      <circle cx="42" cy="52" r="16" fill="#fff" /><circle cx="78" cy="52" r="16" fill="#fff" />
      <g class="eyes-open">
        <circle cx="44" cy="54" r="7" fill="#3b2f5c" /><circle cx="76" cy="54" r="7" fill="#3b2f5c" />
        <circle cx="46" cy="51" r="2.2" fill="#fff" /><circle cx="78" cy="51" r="2.2" fill="#fff" />
      </g>
      <g class="eyes-happy" stroke="#3b2f5c" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M34 56 q8 -10 16 0" /><path d="M70 56 q8 -10 16 0" />
      </g>
      <g class="brows" stroke="#3b2f5c" stroke-width="3.5" stroke-linecap="round">
        <path d="M30 34 L50 40" /><path d="M90 34 L70 40" />
      </g>
      <path d="M54 66 L60 76 L66 66 Z" fill="#ffc93c" />
      <circle cx="30" cy="68" r="5" fill="#ff8fa3" opacity=".6" /><circle cx="90" cy="68" r="5" fill="#ff8fa3" opacity=".6" />
    </svg>
    </div>

    <section id="start" class="card start">
      <h1>Tabelline!</h1>
      <p>Ascolta la domanda e scrivi il risultato.</p>
      <button id="play" class="big-btn">Gioca!</button>
    </section>

    <section id="game" class="game" hidden>
      <div class="progress">
        <div id="stars" class="row" aria-label="Risposte giuste"></div>
        <div id="misses" class="row small" aria-label="Vite"></div>
      </div>
      <div id="card" class="card question">
        <div class="expr"><span id="qa">3</span> × <span id="qb">4</span> =</div>
        <div id="answer" class="answer"></div>
        <button id="repeat" class="repeat" aria-label="Ripeti la domanda">
          <svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" /><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
        </button>
      </div>
      <div id="keypad" class="keypad"></div>
      <div id="choices" class="choices" hidden></div>
    </section>
  </main>

  <div id="banner" class="banner" hidden></div>

  <section id="album" class="album" hidden>
    <div class="album-card">
      <button id="album-close" class="icon-btn close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <h2>Le tue sorprese</h2>
      <div id="album-next" class="album-next"></div>
      <div id="album-grid" class="album-grid"></div>
    </div>
  </section>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script type="module" src="/src/tabelline/main.ts"></script>
</body>
</html>
